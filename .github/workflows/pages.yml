name: Publicar Miriam Estudos
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Auditar conteúdo
        run: python3 scripts/audit.py
      - name: Montar site estático
        run: |
          mkdir -p out/src/data out/public/fontes
          cp index.html manifest.webmanifest sw.js out/
          cp src/app.js src/styles.css out/src/
          cp src/data/course.js out/src/data/
          cp public/fontes/* out/public/fontes/
          touch out/.nojekyll
      - name: Preparar Pages
        uses: actions/configure-pages@v5
      - name: Enviar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
